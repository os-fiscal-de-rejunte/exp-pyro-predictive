[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-fire-intelligence"
version = "0.1.0"
description = "Auditoria e previsão condicional de detecções de focos de calor"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "torch>=2.0", "pyro-ppl>=1.9", "requests>=2.28", "scipy>=1.10", "matplotlib>=3.7", "psutil>=5.9", "zarr>=2.17,<3", "netCDF4>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
windows = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
earthfire = "earthfire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
